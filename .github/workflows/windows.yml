name: Windows build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build, test, and package
        shell: pwsh
        run: ./scripts/build.ps1 -Check -Package
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: Petal-win-x64
          path: |
            artifacts/Petal-win-x64.zip
            artifacts/SHA256SUMS.txt
